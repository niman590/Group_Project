<!--
Purpose - Display the admin sidebar navigation layout for the Civic Plan admin portal.
Input - Flask/Jinja route URLs, active page value, request endpoint, and static logo/script paths.
Output - Responsive admin sidebar with navigation links, logout link, mobile toggle, overlay, and sidebar script.
Author - R.A.D. Akash Dhananjaya Randeniya
Date - 2026-04-12
-->
<aside class="sidebar admin-sidebar" id="adminSidebar">
    <div class="sidebar-top">
        <div class="sidebar-brand">
            <a href="{{ url_for('admin.admin_dashboard') }}" class="brand-link">
                <img src="{{ url_for('static', filename='images/logo-removebackground.png') }}" alt="Civic Plan Logo" />
                <div class="brand-text">
                    <h2>CIVIC PLAN</h2>
                    <p>Admin Portal</p>
                </div>
            </a>

            <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>

        <!-- Admin navigation links with active state handling based on the current page or endpoint. -->
        <nav class="sidebar-nav">
            <a href="{{ url_for('admin.admin_dashboard') }}"
                class="nav-link {% if active_page == 'dashboard' or request.endpoint == 'admin.admin_dashboard' %}active{% endif %}">
                <span class="nav-icon"><i class="fa-solid fa-table-columns"></i></span>
                <span class="nav-text">Dashboard</span>
            </a>

            <a href="{{ url_for('admin_planning.admin_planning_applications') }}"
                class="nav-link {% if active_page == 'planning_applications' or request.endpoint == 'admin_planning.admin_planning_applications' or request.endpoint == 'admin_planning.admin_planning_application_detail' or request.endpoint == 'admin_planning.review_planning_application' or request.endpoint == 'admin_planning.planning_office_approval' or request.endpoint == 'admin_planning.deputy_director_review_page' or request.endpoint == 'admin_planning.district_project_committee_review' %}active{% endif %}">
                <span class="nav-icon"><i class="fa-solid fa-file-circle-check"></i></span>
                <span class="nav-text">Planning Applications</span>
            </a>

            <a href="{{ url_for('admin.admin_transaction_history_requests') }}"
                class="nav-link {% if active_page == 'transaction_requests' or request.endpoint == 'admin.admin_transaction_history_requests' %}active{% endif %}">
                <span class="nav-icon"><i class="fa-solid fa-clock-rotate-left"></i></span>
                <span class="nav-text">Transaction Requests</span>
            </a>

            <a href="{{ url_for('admin.admin_add_deed_page') }}"
                class="nav-link {% if active_page == 'add_deed' or request.endpoint == 'admin.admin_add_deed_page' or request.endpoint == 'admin.admin_add_deed' %}active{% endif %}">
                <span class="nav-icon"><i class="fa-solid fa-file-circle-plus"></i></span>
                <span class="nav-text">Add New Deed</span>
            </a>

            <a href="{{ url_for('admin_reports.admin_reports') }}"
                class="nav-link {% if request.endpoint == 'admin_reports.admin_reports' or request.endpoint == 'admin_reports.download_admin_reports_pdf' or request.endpoint == 'admin_reports.download_user_registration_pdf' or request.endpoint == 'admin_reports.download_applicants_pdf' %}active{% endif %}">
                <span class="nav-icon"><i class="fa-solid fa-chart-line"></i></span>
                <span class="nav-text">Reports</span>
            </a>

            <a href="{{ url_for('admin.admin_suspicious_behavior') }}"
                class="nav-link {% if active_page == 'suspicious_behavior' or request.endpoint == 'admin.admin_suspicious_behavior' %}active{% endif %}">
                <span class="nav-icon"><i class="fa-solid fa-shield-halved"></i></span>
                <span class="nav-text">Suspicious Behavior</span>
            </a>

            <a href="{{ url_for('admin.admin_users') }}"
                class="nav-link {% if active_page == 'user_management' or request.endpoint == 'admin.admin_users' %}active{% endif %}">
                <span class="nav-icon"><i class="fas fa-users"></i></span>
                <span class="nav-text">User Management</span>
            </a>

            <a href="{{ url_for('user.account') }}"
                class="nav-link {% if request.endpoint == 'user.account' %}active{% endif %}">
                <span class="nav-icon"><i class="fa-solid fa-user"></i></span>
                <span class="nav-text">My Account</span>
            </a>
        </nav>
    </div>

    <!-- Sidebar footer section for admin logout access. -->
    <div class="sidebar-footer">
        <a href="{{ url_for('auth.logout') }}" class="nav-link logout-link">
            <span class="nav-icon"><i class="fa-solid fa-right-from-bracket"></i></span>
            <span class="nav-text">Logout</span>
        </a>
    </div>
</aside>

<!-- Mobile sidebar toggle button and overlay for responsive admin navigation. -->
<button type="button" class="mobile-sidebar-toggle" id="mobileSidebarToggle" aria-label="Open sidebar">
    <i class="fa-solid fa-bars"></i>
</button>

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script src="{{ url_for('static', filename='admin_sidebar.js') }}"></script>
