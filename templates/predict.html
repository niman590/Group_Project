<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Land Value Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='predict.css') }}">
</head>

<body>
    <main class="prediction-page">
        <section class="prediction-card">
            <div class="page-header">
                <span class="page-kicker">Land Valuation</span>
                <h2>Land Value Prediction</h2>
                <p>
                    Enter land details below to estimate the current value and future predicted land value.
                </p>
            </div>

            <form class="prediction-form" id="landPredictionForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="publication_year">Publication Year</label>
                        <input id="publication_year" type="number" placeholder="Publication Year">
                    </div>

                    <div class="form-group">
                        <label for="land_size">Land Size</label>
                        <input id="land_size" type="number" min="6" step="0.1" placeholder="Land Size (minimum 6 perches)">
                    </div>

                    <div class="form-group">
                        <label for="access_road_size">Access Road Size</label>
                        <input id="access_road_size" type="number" placeholder="Access Road Size">
                    </div>

                    <div class="form-group">
                        <label for="distance_to_city">Distance to City</label>
                        <input id="distance_to_city" type="number" step="0.1" placeholder="Distance to City">
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <select id="location">
                            <option value="Ragama">Ragama</option>
                            <option value="Rajagiriya">Rajagiriya</option>
                            <option value="Malabe">Malabe</option>
                            <option value="Ja-Ela">Ja-Ela</option>
                            <option value="Kelaniya">Kelaniya</option>
                            <option value="Kadana">Kadana</option>
                            <option value="Kadawatha">Kadawatha</option>
                            <option value="Kaduwela">Kaduwela</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="zone_type">Zone Type</label>
                        <select id="zone_type">
                            <option value="Residential">Residential</option>
                            <option value="Commercial">Commercial</option>
                            <option value="Agricultural">Agricultural</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="electricity">Electricity</label>
                        <input id="electricity" type="number" min="0" max="1" placeholder="Electricity (1 or 0)">
                    </div>

                    <div class="form-group">
                        <label for="water">Water</label>
                        <input id="water" type="number" min="0" max="1" placeholder="Water (1 or 0)">
                    </div>

                    <div class="form-group">
                        <label for="flood_risk">Flood Risk</label>
                        <input id="flood_risk" type="number" min="0" max="1" placeholder="Flood Risk (1 or 0)">
                    </div>
                </div>

                <button type="submit" class="predict-btn" id="predictBtn">
                    Predict
                </button>
            </form>

            <p id="message" class="message"></p>

            <section class="results-section">
                <h3>Results</h3>

                <div class="results-grid">
                    <div class="result-card">
                        <span>Current Value</span>
                        <strong id="current_value">-</strong>
                    </div>

                    <div class="result-card">
                        <span>Predicted 1 Year</span>
                        <strong id="predicted_1_year">-</strong>
                    </div>

                    <div class="result-card">
                        <span>Predicted 5 Year</span>
                        <strong id="predicted_5_year">-</strong>
                    </div>
                </div>
            </section>
        </section>
    </main>

    <script src="{{ url_for('static', filename='predict.js') }}"></script>
</body>

</html>
